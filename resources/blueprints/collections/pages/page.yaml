title: Seite
tabs:
  main:
    display: Inhalt
    sections:
      -
        display: Inhalt
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Titel
              localizable: true
          -
            handle: page_elements
            field:
              collapse: true
              type: replicator
              display: Inhalte
              localizable: true
              sets:
                content_elements:
                  display: Hauptelemente
                  icon: layers-stacks
                  sets:
                    editor:
                      display: Texteditor
                      instructions: 'Text mit Downloads, Buttons und weiteren Elementen'
                      icon: text-formatting-markdown
                      fields:
                        -
                          import: editor
                    teasers:
                      display: Teaser
                      instructions: 'Manuelle Teaser, Beitragsteaser oder Teaser aus der Sammlung'
                      icon: text-formatting-image-top
                      fields:
                        -
                          import: teasers
                    tiles:
                      display: Kacheln
                      instructions: 'Kacheln mit Text, optional verlinkt (z.B. Unterseiten, Themen)'
                      icon: layout-grid
                      fields:
                        -
                          import: tiles
                    list_posts:
                      display: 'Beiträge verknüpfen'
                      instructions: 'Beiträge nach Kategorie anzeigen'
                      icon: dashboard-layout-2
                      fields:
                        -
                          import: list_posts
                    images:
                      display: Bilder
                      instructions: 'Ein oder mehrere Bilder'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: images
                    image_text_topic:
                      display: 'Bild/Text (Fachbereich)'
                      instructions: 'Bild/Text Element für Fachbereich'
                      icon: text-formatting-wrap-image-left
                      fields:
                        -
                          import: image_text_topic
                    video:
                      display: Video
                      instructions: 'Video hinzufügen'
                      icon: movie-video-clip
                      fields:
                        -
                          import: video
                special_elements:
                  display: Spezialelemente
                  icon: puzzle-piece
                  sets:
                    module:
                      display: Modul
                      instructions: 'Anlässe, Kurse, Publikationen, Suche oder Formulare'
                      icon: programming-module-box-cube
                      fields:
                        -
                          import: module
                    team:
                      display: Team
                      instructions: 'Team hinzufügen'
                      icon: team
                      fields:
                        -
                          import: team
                    sponsors:
                      display: Sponsoren
                      instructions: 'Sponsoren hinzufügen'
                      icon: favorite-award-prize
                      fields:
                        -
                          import: sponsors
                    splash:
                      display: Störer
                      instructions: 'Störer Element hinzufügen'
                      icon: align-object-center
                      fields:
                        -
                          import: splash
                    quote:
                      display: Zitat
                      instructions: 'Zitat hinzufügen'
                      icon: text-formatting-quotation
                      fields:
                        -
                          import: quote
                    interactive_svg:
                      display: 'Interaktives SVG'
                      instructions: 'Interaktives SVG hinzufügen'
                      icon: programming-script-code-brackets
                      fields:
                        -
                          import: interactive_svg
  media:
    display: Medien
    sections:
      -
        display: Medien
        fields:
          -
            handle: header_image
            field:
              container: assets
              folder: mood
              type: assets
              display: Headerbilder
              localizable: false
              instructions: 'Sind mehrere Bilder hinterlegt, wird zufällig eines ausgewählt.'
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  settings:
    display: Einstellungen
    sections:
      -
        display: Einstellungen
        fields:
          -
            import: settings
          -
            import: search_index
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
