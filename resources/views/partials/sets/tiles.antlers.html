{{ partial:layout/content-fullscreen :badge="badge ?? title" badgeClass="!hidden md:!flex" }}
  <div class="grid grid-cols-12 gap-x-15 gap-y-25 md:ml-30 xl:-ml-20">
    {{ tiles }}
      {{ if link }}
        <a 
          href="{{ link }}"
          class="col-span-12 md:col-span-6 border-t border-black bg-white p-15 lg:p-20 lg:pt-15 leading-[1.25] [&>h3]:font-regular[&>h3]:text-base [&>h3]:lg:text-lg [&>h3]:leading-[1.25] [&>h3]:mb-5 hyphens-auto no-underline hover:bg-lime transition-all"
          title="{{ title }}">
          {{ text }}
        </a>
      {{ else }}
        <div class="col-span-12 md:col-span-6 border-t border-black bg-white p-15 lg:p-20 lg:pt-15 hyphens-auto [&>h3]:text-base [&>h3]:lg:text-lg [&>h3]:leading-[1.25] [&>h3]:hyphens-auto [&>h3]:mb-5 [&>h3]:lg:mb-10">
          {{ text }}
        </div>
      {{ /if }}
    {{ /tiles }}
  </div>
{{ /partial:layout/content-fullscreen }}
