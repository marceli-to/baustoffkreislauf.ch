title: Teaser
fields:
  -
    handle: image
    field:
      max_files: 1
      container: assets
      type: assets
      display: Bild
      localizable: true
  -
    handle: video_source
    field:
      options:
        none: 'Kein Video'
        url: 'Link (YouTube, Vimeo)'
        file: 'Datei (MP4)'
      default: none
      clearable: false
      type: button_group
      display: Video
      instructions: 'Optional. Das Bild wird zum Vorschaubild im Breitformat (16:9) mit Play-Knopf, das Video lädt erst beim Klick.'
      localizable: true
  -
    handle: video_url
    field:
      type: text
      input_type: url
      display: 'Video-Link'
      instructions: 'Die Adresse des Videos, z.B. https://www.youtube.com/watch?v=… oder https://vimeo.com/…'
      localizable: true
      if:
        video_source: 'equals url'
  -
    handle: video_file
    field:
      max_files: 1
      container: assets
      allow_uploads: true
      type: assets
      display: Videodatei
      instructions: 'MP4, möglichst klein (z.B. 720p, unter 50 MB).'
      localizable: true
      if:
        video_source: 'equals file'
  -
    handle: image_ratio
    field:
      options:
        portrait: Hochformat
        landscape: Querformat
        square: Quadrat
        wide: 'Breitformat (16:9)'
      type: select
      display: 'Format Vorschaubild'
      localizable: true
      default: portrait
      instructions: 'Seitenverhältnis für Vorschaubild'
      unless:
        video_source: 'contains_any url, file'
  -
    handle: title
    field:
      type: text
      display: Titel
      localizable: true
      validate:
        - required
  -
    handle: text
    field:
      buttons:
        - bold
        - anchor
      toolbar_mode: floating
      remove_empty_nodes: true
      type: bard
      display: Text
      localizable: true
      validate:
        - required
  -
    handle: link
    field:
      collections:
        - pages
      container: assets
      type: link
      display: Link
      localizable: true
      width: 50
  -
    handle: link_text
    field:
      type: text
      display: Linktext
      localizable: true
      width: 50
