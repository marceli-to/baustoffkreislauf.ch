title: Teaser
fields:
  -
    handle: teaser
    field:
      collapse: true
      type: replicator
      display: Teaser
      localizable: false
      instructions_position: below
      sets:
        teasers:
          display: Teaser
          sets:
            teaser:
              display: 'Manueller Teaser'
              instructions: 'Bild, Titel, Text und Link direkt hier erfassen.'
              icon: text-formatting-image-top
              fields:
                -
                  handle: has_border_top
                  field:
                    type: toggle
                    display: 'Rahmen (oben)'
                    localizable: false
                -
                  import: teaser
            teaser_post:
              display: Beitragsteaser
              instructions: 'Einen Beitrag anteasern.'
              icon: media-news-paper
              fields:
                -
                  import: teaser_post
            teaser_entry:
              display: 'Teaser aus Sammlung'
              instructions: 'Einen Teaser aus der Sammlung «Teaser» wiederverwenden.'
              icon: entry
              fields:
                -
                  handle: entry
                  field:
                    type: entries
                    display: Teaser
                    collections:
                      - teaser
                    max_items: 1
                    mode: default
                    localizable: false
                    validate:
                      - required
