title: Editor
fields:
  -
    handle: content
    field:
      buttons:
        - h1
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - removeformat
        - anchor
        - lead
      toolbar_mode: floating
      remove_empty_nodes: false
      type: bard
      display: Inhalt
      container: assets
      localizable: true
      sets:
        downloads:
          display: Downloads
          icon: download
          sets:
            download:
              display: Download
              instructions: 'Datei als Textlink, mit Datum (Medienmitteilung) oder mit Vorschaubild (Logo)'
              icon: download-arrow-down
              fields:
                -
                  import: download
            protected_file:
              display: 'Datei (geschützt)'
              instructions: 'Passwortgeschützte Datei hinzufügen'
              icon: padlock-locked
              fields:
                -
                  import: protected_file
            image_downloads:
              display: 'Bilder Download'
              instructions: 'Hochauflösende Bilder für Download'
              icon: media-image-picture-gallery
              fields:
                -
                  import: image_downloads
        special_elements:
          display: Spezialelemente
          icon: puzzle-piece
          sets:
            newsletter_form:
              display: 'Newsletter Formular'
              instructions: 'Newsletter Formular hinzufügen'
              icon: form-text-field
              fields:
                -
                  import: newsletter_form
            button_panel:
              display: 'Button (Kachel)'
              instructions: 'Button hinzufügen'
              icon: link
              fields:
                -
                  handle: link_url
                  field:
                    collections:
                      - pages
                      - events
                      - courses
                      - publications
                    container: assets
                    type: link
                    display: Link
                    localizable: true
                -
                  handle: link_text
                  field:
                    type: text
                    display: Text
                    localizable: true
                -
                  handle: target
                  field:
                    options:
                      -
                        key: _blank
                        value: 'Neuer Tab'
                      -
                        key: _self
                        value: 'Gleicher Tab'
                    default: _self
                    type: select
                    display: 'Öffnen in'
                    localizable: false
            embed_code:
              display: 'Embed Code'
              instructions: 'Feld für eingebetteten Code hinzufügen'
              icon: programming-script-code-brackets
              fields:
                -
                  import: embed_code
  -
    handle: has_indent
    field:
      type: toggle
      display: 'Texteinzug?'
      instructions: 'Texteinzug für Inhalte.'
      localizable: false
