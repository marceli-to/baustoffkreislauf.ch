title: Kacheln
fields:
  -
    handle: badge
    field:
      type: text
      display: Beschriftung
      instructions: 'Senkrechte Beschriftung am linken Rand. Leer lassen, um den Seitentitel zu verwenden.'
      localizable: true
  -
    handle: tiles
    field:
      type: replicator
      display: Kacheln
      localizable: true
      collapse: false
      sets:
        tiles:
          display: Kacheln
          sets:
            tile:
              display: Kachel
              instructions: 'Kachel hinzufügen. Mit Link wird die ganze Kachel klickbar.'
              icon: layout-grid
              fields:
                -
                  handle: text
                  field:
                    buttons:
                      - h3
                      - bold
                      - removeformat
                      - text-medium
                    toolbar_mode: floating
                    remove_empty_nodes: true
                    type: bard
                    display: Text
                    localizable: true
                -
                  handle: link
                  field:
                    collections:
                      - pages
                    type: link
                    display: Link
                    localizable: true
